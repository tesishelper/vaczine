android {

    namespace "com.vaczine"
    // Usamos el último SDK (35) para compilación
    compileSdk = 35

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            aidl.srcDirs = ['src']
            renderscript.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs']
        }

    }
    packagingOptions {
        resources {
            excludes += ['META-INF/robovm/ios/robovm.xml']
        }
    }
    defaultConfig {
        applicationId "com.vaczine"
        // TargetSdkVersion 35 es el requisito actual de Google Play
        minSdkVersion 23
        targetSdkVersion 35
        versionCode 22
        versionName '3.21'
        multiDexEnabled true
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            ndk {
                // ** SOLUCIÓN PARA SÍMBOLOS DE DEPURACIÓN **
                debugSymbolLevel 'SYMBOL_TABLE'
                // ** SOLUCIÓN PARA 64-BIT **: Solo se mantienen las arquitecturas de 64 bits y x86
                abiFilters 'arm64-v8a', 'x86', 'x86_64'
            }
        }


    }
}

dependencies {
    // Estas son las dependencias específicas de Android (Ads, Fragment)
    implementation 'com.google.android.gms:play-services-ads:24.7.0'
    implementation "androidx.fragment:fragment:1.8.9"

}

// called every time gradle gets executed, takes the native dependencies of
// the natives configuration, and extracts them to the proper libs/ folders
// so they get packed with the APK.
tasks.register('copyAndroidNatives') {
    doFirst {
        // ** SE ELIMINAN armeabi y armeabi-v7a de la creación de carpetas **
        file("libs/arm64-v8a/").mkdirs()
        file("libs/x86_64/").mkdirs()
        file("libs/x86/").mkdirs()

        configurations.natives.files.each { jar ->
            def outputDir = null
            if (jar.name.endsWith("natives-arm64-v8a.jar")) outputDir = file("libs/arm64-v8a")
            // ** SE ELIMINAN LAS COMPROBACIONES OBSOLETAS DE 32 BITS **
            if (jar.name.endsWith("natives-x86_64.jar")) outputDir = file("libs/x86_64")
            if (jar.name.endsWith("natives-x86.jar")) outputDir = file("libs/x86")
            if (outputDir != null) {
                copy {
                    from zipTree(jar)
                    into outputDir
                    include "*.so"
                }
            }
        }
    }
}

tasks.whenTaskAdded { packageTask ->
    if (packageTask.name.contains("package")) {
        packageTask.dependsOn 'copyAndroidNatives'
    }
}

tasks.register('run', Exec) {
    def path
    def localProperties = project.file("../local.properties")
    if (localProperties.exists()) {
        Properties properties = new Properties()
        localProperties.withInputStream { instr ->
            properties.load(instr)
        }
        def sdkDir = properties.getProperty('sdk.dir')
        if (sdkDir) {
            path = sdkDir
        } else {
            path = "$System.env.ANDROID_HOME"
        }
    } else {
        path = "$System.env.ANDROID_HOME"
    }

    def adb = path + "/platform-tools/adb"
    commandLine "$adb", 'shell', 'am', 'start', '-n', 'com.vaczine/com.vaczine.AndroidLauncher'
}
